<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   Limelight Workspace — single-file web app, Supabase backend
   Data lives in Supabase (one table per collection, each row stored as jsonb) and syncs live
   to every signed-in device. localStorage only keeps a cache + the session. Roles: admin / ops / member.
   Departments: Production, Editing, Designing, Developers.
   ============================================================ */
'use strict';
const KEY = 'limelight_db_v2', SKEY = 'limelight_session';
const DEPTS = ['Production', 'Editing', 'Designing', 'Developers'];
const DEPT_COLOR = { Production: '#E86A1F', Editing: '#7A3EE8', Designing: '#D6467F', Developers: '#2F5BEA' };
const MODES = { office: 'Office', wfh: 'Work from home', field: 'On field' }, MTONE = { office: 'ok', wfh: 'info', field: 'warn' };
const ROLES = { admin: 'Admin', ops: 'Operations', member: 'Employee' };
const LEAVE = { casual: 'Casual', sick: 'Sick', earned: 'Earned', compoff: 'Comp-off', unpaid: 'Unpaid' };
const PRIO = { none: ['No priority', '#C6C6C2'], low: ['Low', '#8A8A84'], med: ['Medium', '#FCD30A'], high: ['High', '#E86A1F'], urgent: ['Urgent', '#C8322F'] };
const STATUSES = ['To do', 'In progress', 'Review', 'Done'];

/* ---------- storage ---------- */
const blank = () => ({ seq: 1, users: [], attendance: [], leaves: [], regs: [], expenses: [], worklogs: [], tasks: [], comments: [], announcements: [], acks: [], notifications: [], holidays: [], todos: [],
  settings: { company: 'Limelight', office_name: 'Babylon Tower, VIP Square, Raipur', office_lat: 21.2396, office_lng: 81.6773, office_radius: 250, home_radius: 250, work_start: '10:00', work_end: '19:00', grace: 15, weekly_off: '0', quota: { casual: 12, sick: 8, earned: 15 }, exp_cats: ['Travel', 'Food', 'Client meeting', 'Equipment', 'Printing', 'Other'], currency: '₹' } });

/* ---------- backend (Supabase) ----------
   Setup: run supabase/schema.sql once in the Supabase SQL editor, then paste the project's
   "anon public" key below (Dashboard → Project settings → API). */
const SUPABASE_URL = 'https://lwpueuxyuokszeflgyfv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HX3OFYXKbLL9F2ylHmMdKQ_0bgNHF3W';
const TABLES = ['users', 'attendance', 'leaves', 'regs', 'expenses', 'worklogs', 'tasks', 'comments', 'announcements', 'acks', 'notifications', 'holidays', 'todos'];
const sb = window.supabase && SUPABASE_ANON_KEY !== 'PASTE_YOUR_ANON_KEY_HERE' ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let DB = blank(), me = null, online = false;
const synced = Object.fromEntries(TABLES.map(t => [t, new Map()])); let syncedSettings = '';   // last state written to / read from the server, per row
const canon = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(x => [x, v[x]])) : v);   // key-order independent (jsonb reorders keys)
const nid = () => Date.now() * 1000 + Math.floor(Math.random() * 1000);   // unique across devices without a round-trip
const cache = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch { } };
const sha = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); };
const checkPw = async (u, pw) => u.password === await sha(pw) || u.password === pw;   // plain-text fallback for accounts created before hashing
async function fetchAll(t) { const out = []; for (let from = 0; ; from += 1000) { const { data, error } = await sb.from(t).select('id,data').order('id').range(from, from + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out; }
async function load() {
  const rows = await Promise.all(TABLES.map(fetchAll)); const s = await sb.from('settings').select('data').eq('id', 1).maybeSingle(); if (s.error) throw s.error;
  const fresh = blank();
  TABLES.forEach((t, i) => { fresh[t] = rows[i].map(r => { const o = r.data; o.id = r.id; synced[t].set(r.id, canon(o)); return o; }); });
  if (s.data) fresh.settings = { ...fresh.settings, ...s.data.data }; syncedSettings = canon(fresh.settings);
  DB = fresh; online = true; cache();
}
function save() {   // diff every collection against what the server has and push only the changes
  cache(); if (!sb || !online) return;
  const ops = [];
  for (const t of TABLES) { const m = synced[t], seen = new Set(), up = [];
    for (const r of DB[t]) { if (r.id == null) r.id = nid(); seen.add(r.id); const j = canon(r); if (m.get(r.id) !== j) { m.set(r.id, j); up.push({ id: r.id, data: r }); } }
    const del = [...m.keys()].filter(id => !seen.has(id)); del.forEach(id => m.delete(id));
    if (up.length) ops.push({ t, ids: up.map(r => r.id), p: sb.from(t).upsert(up) });
    if (del.length) ops.push({ t, ids: del, del: true, p: sb.from(t).delete().in('id', del) }); }

    const t = p.table;

/* ---------- attendance logic ---------- */
const hav = (a, b, c, d) => { const R = 6371000, r = x => x * Math.PI / 180, dl = r(c - a), dn = r(d - b); const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

const breakMins = a => (a.breaks || []).reduce((s, b) => s + (new Date(b.end || nowIso()) - new Date(b.start)) / 6e4, 0);
const worked = a => Math.max(0, (new Date(a.out || nowIso()) - new Date(a.in)) / 6e4 - breakMins(a));
const onBreak = a => !!(a.breaks || []).some(b => !b.end);

function clockOut() { const a = attOf(me.id); if (!a || a.out) return; if (!confirm('Clock out for today?')) return; (a.breaks || []).forEach(b => { if (!b.end) b.end = nowIso(); }); a.out = nowIso(); save(); toast(`Clocked out. You worked ${fmtDur(worked(a))} today.`); render(); }

const PAGES = {};
const title = (t, sub, actions = '') => `<div class="pt"><div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ''}</div><span class="grow"></span>${actions}</div>`;
const card = (t, body, { acc, action = '', cls = '' } = {}) => `<section class="panel ${cls}" ${acc ? `style="--acc:${acc}"` : ''}>${t ? `<header class="ph">${acc ? '<i class="pbar"></i>' : ''}<h3>${t}</h3>${action}</header>` : ''}<div class="pb">${body}</div></section>`;
const stat = (ic, v, l, tone = '', href = '') => `<${href ? `a href="${href}"` : 'div'} class="stat ${tone}"><span class="si">${ic}</span><div><div class="sv">${v}</div><div class="sl">${l}</div></div></${href ? 'a' : 'div'}>`;
const empty = t => `<div class="empty">${t}</div>`;
const tabsHtml = (items, cur, act) => `<div class="tabs">${items.map(([k, l, b]) => `<button class="tb ${cur === k ? 'on' : ''}" data-act="${act}" data-arg="${k}">${l}${b ? `<span class="badge">${b}</span>` : ''}</button>`).join('')}</div>`;
const myTasks = uid => DB.tasks.filter(t => t.assignees.includes(uid));

/* Home — every employee's own dashboard */
PAGES[''] = () => {
  const t = today(), a = attOf(me.id); const h = new Date().getHours();
  const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const mine = myTasks(me.id), open = mine.filter(x => x.status !== 'Done'), overdue = open.filter(x => x.due && x.due < t).length, dueToday = open.filter(x => x.due === t).length;
  const unack = DB.announcements.filter(x => x.needs_ack && !DB.acks.some(k => k.a === x.id && k.u === me.id)).length;
  const alerts = DB.notifications.filter(n => n.user_id === me.id && n.kind === 'alert' && !n.read).length;
  const ws = addDays(t, -((new Date(t + 'T00:00').getDay() + 6) % 7)); const weekMins = DB.attendance.filter(x => x.user_id === me.id && x.date >= ws && x.date <= t).reduce((s, x) => s + worked(x), 0);
  const month = t.slice(0, 7), present = DB.attendance.filter(x => x.user_id === me.id && x.date.startsWith(month)).length;
  const myPending = DB.leaves.filter(l => l.user_id === me.id && l.status === 'pending').length + DB.regs.filter(l => l.user_id === me.id && l.status === 'pending').length + DB.expenses.filter(l => l.user_id === me.id && l.status === 'pending').length;
  const pend = DB.leaves.filter(l => l.status === 'pending').length + DB.regs.filter(r => r.status === 'pending').length + DB.expenses.filter(e => e.status === 'pending').length;
  const hol = holiday(t), lv = leaveOn(me.id, t), off = isOff(t);
  const reported = DB.worklogs.some(w => w.user_id === me.id && w.date === t);
  const cc = !a ? `<div class="cc idle"><div><div class="ccl">You haven't clocked in yet</div><div class="ccb">Ready to start?</div><div class="ccs">${hol ? `Today is a holiday — ${esc(hol)}.` : off ? "It's your weekly off." : lv ? `You're on ${LEAVE[lv.type]} leave today.` : 'Your work mode (Office / Home / Field) is detected from your location.'}</div></div><button class="btn p lg" data-act="beginClockIn">📍 Clock in</button></div>`
    : `<div class="cc ${a.out ? 'done' : onBreak(a) ? 'paused' : 'live'}"><div><div class="ccl"><span class="dot ${a.mode}"></span>${MODES[a.mode]} · in at ${fmtTime(a.in)}${a.out ? ' · out at ' + fmtTime(a.out) : ''}${isLate(a) ? pill('Late', 'bad') : ''}</div><div class="ccb tab">${fmtDur(worked(a))}</div><div class="ccs">${a.out ? 'worked today. See you tomorrow!' : onBreak(a) ? `On a break · ${Math.round(breakMins(a))} min of breaks so far` : `worked so far${breakMins(a) ? ` · ${Math.round(breakMins(a))} min of breaks` : ''}`}</div></div>${!a.out ? `<div class="row wrap">${onBreak(a) ? '<button class="btn p lg" data-act="breakToggle">▶ End break</button>' : '<button class="btn lg" data-act="breakToggle">☕ Take a break</button><button class="btn d lg" data-act="clockOut">Clock out</button>'}</div>` : ''}</div>`;
  const nudges = [unack && `<a class="nudge warn" href="#/announcements">📌 ${unack} announcement${unack > 1 ? 's need' : ' needs'} your acknowledgement</a>`, overdue && `<a class="nudge bad" href="#/tasks">🔥 ${overdue} overdue task${overdue > 1 ? 's' : ''}</a>`, dueToday && `<a class="nudge" href="#/tasks">📅 ${dueToday} due today</a>`, alerts && `<a class="nudge bad" href="#/alerts">⚠️ ${alerts} unread alert${alerts > 1 ? 's' : ''}</a>`, (!reported && a && h >= 17) && `<a class="nudge" href="#/worklog">📝 Don't forget today's work report</a>`].filter(Boolean);
  const dept = me.department, deptPeople = DB.users.filter(u => u.active && u.department === dept);
  const people = (list, right, e) => list.length ? list.map(p => `<div class="lr">${av(p, 'sm')}<span class="grow">${esc(p.name)}${p.department ? `<span class="small muted"> · ${p.department}</span>` : ''}</span><span class="muted small">${right(p)}</span></div>`).join('') : empty(e);
  const onLeave = DB.users.filter(u => u.active && leaveOn(u.id, t)), remote = DB.attendance.filter(x => x.date === t && x.mode !== 'office').map(x => ({ ...user(x.user_id), mode: x.mode }));
  const bdays = DB.users.filter(u => u.active && u.birthday).map(u => { const n = new Date(t + 'T00:00'); let d = new Date(`${n.getFullYear()}-${u.birthday.slice(5)}T00:00`); if (d < n) d.setFullYear(n.getFullYear() + 1); return { ...u, days: Math.round((d - n) / 864e5), date: dstr(d) }; }).filter(x => x.days <= 30).sort((a, b) => a.days - b.days);
  const joiners = DB.users.filter(u => u.active && u.joined && (new Date(t) - new Date(u.joined)) / 864e5 <= 45);
  const hols = DB.holidays.filter(x => x.date >= t).sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 5);
  const byStatus = {}; for (const x of mine) byStatus[x.status] = (byStatus[x.status] || 0) + 1;
  const todos = DB.todos.filter(x => x.user_id === me.id);
  return `<div class="hero"><div><div class="g">${greet} · ${fmtLong(t)}</div><h1>Hi, ${esc(me.name.split(' ')[0])}.</h1><div class="small mt" style="color:rgba(255,255,255,.7)">${esc(me.title || 'Team member')}${dept ? ' · ' + dept : ''}${hol ? ' · 🎉 ' + esc(hol) : ''}</div></div><span class="grow"></span><div class="row wrap"><button class="btn p" data-act="assignWork">＋ Assign work</button><a class="btn gl" href="#/worklog">${reported ? "Edit today's report" : "Write today's report"}</a></div></div>
  ${cc}${nudges.length ? `<div class="row wrap">${nudges.join('')}</div>` : ''}
  <div class="grid c4 stats">${stat('⏱', fmtDur(weekMins), 'Worked this week', '', '#/attendance')}${stat('📍', present, 'Days present this month', 'ok', '#/attendance')}${stat('✅', open.length, 'Open tasks', overdue ? 'bad' : 'info', '#/tasks')}${isStaff() ? stat('🗂', pend, 'Approvals waiting', pend ? 'bad' : '', '#/approvals') : stat('📨', myPending, 'My pending requests', '', '#/leaves')}</div>
  <div class="grid c3">
    ${card('Due next', open.length ? open.sort((x, y) => (x.due || '9') < (y.due || '9') ? -1 : 1).slice(0, 6).map(x => `<a class="lr" href="#/boards/${x.department}?task=${x.id}" style="text-decoration:none"><span class="prio" style="background:${DEPT_COLOR[x.department]};width:9px;height:9px"></span><span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}</span>${x.due ? `<span class="due small ${x.due < t ? 'late' : x.due === t ? 'soon' : ''}">${fmtDate(x.due)}</span>` : ''}</a>`).join('') : empty('Nothing open. Enjoy the quiet.'), { acc: '#FCD30A', action: '<a class="small" href="#/tasks">All tasks</a>' })}
    ${card(dept ? `${dept} today` : 'Your department', dept ? (deptPeople.length ? deptPeople.map(p => { const pa = attOf(p.id); const l = leaveOn(p.id, t); return `<div class="lr">${av(p, 'sm')}<span class="grow">${p.id === me.id ? 'You' : esc(p.name)}<div class="small muted">${esc(p.title || '')}</div></span>${l ? pill('On leave', 'info') : pa ? pill(pa.out ? 'Done' : MODES[pa.mode], MTONE[pa.mode]) : pill('Not in')}</div>`; }).join('') : empty('Just you so far.')) : empty('Ask an admin to add you to a department to assign and receive department work.'), { acc: '#2F5BEA', action: dpill(dept) })}
    ${card('Announcements', DB.announcements.length ? DB.announcements.slice().sort((x, y) => y.pinned - x.pinned || (x.at < y.at ? 1 : -1)).slice(0, 3).map(x => `<a class="lr" href="#/announcements" style="text-decoration:none;align-items:flex-start"><span class="grow"><div style="font-weight:500">${x.pinned ? '📌 ' : ''}${esc(x.title)}</div><div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.body)}</div></span>${x.needs_ack && !DB.acks.some(k => k.a === x.id && k.u === me.id) ? pill('Ack', 'warn') : `<span class="small muted">${ago(x.at)}</span>`}</a>`).join('') : empty('No announcements yet.'), { acc: '#0A0A0A', action: '<a class="small" href="#/announcements">All</a>' })}
  </div>
  <h2 style="font-size:15px">Company pulse</h2>
  <div class="grid c3">${card('On leave today', people(onLeave, p => { const l = leaveOn(p.id, t); return l.half ? l.half + ' half' : 'until ' + fmtDate(l.to); }, "Everyone's available today"), { acc: '#2E7D4F' })}${card('Working remotely', people(remote, p => MODES[p.mode], "Everyone who's in is at the office"), { acc: '#E86A1F' })}${card('Holidays', hols.length ? hols.map(x => `<div class="lr"><span class="grow">${esc(x.name)}</span><span class="muted small">${fmtDate(x.date)}</span></div>`).join('') : empty('No upcoming holidays added'), { acc: '#FCD30A', action: '<a class="small" href="#/calendar">Calendar</a>' })}
  ${card('Birthdays', people(bdays, p => p.days === 0 ? '🎂 Today' : p.days === 1 ? 'Tomorrow' : fmtDate(p.date), 'No birthdays in the next 30 days'), { acc: '#C8322F' })}${card('New joiners', people(joiners, p => fmtDate(p.joined), 'No one joined in the last 45 days'), { acc: '#7A3EE8' })}
  ${card('Task status', Object.keys(byStatus).length ? Object.entries(byStatus).map(([n, c]) => `<div style="margin-bottom:10px"><div class="row small"><span>${n}</span><span class="grow"></span><b>${c}</b></div><div class="bar"><i class="${n === 'Done' ? 'ok' : ''}" style="width:${c / mine.length * 100}%"></i></div></div>`).join('') : empty('No tasks assigned to you yet'), { action: pill(mine.length + ' total') })}</div>
  ${card('My to-do list', `<form class="row" data-form="todo"><input name="text" placeholder="Add a to-do and press Enter"><button class="btn p sm">Add</button></form><div class="mt">${todos.map(x => `<div class="todo ${x.done ? 'done' : ''}"><input type="checkbox" ${x.done ? 'checked' : ''} data-act="todoToggle" data-arg="${x.id}"><span class="grow">${esc(x.text)}</span><button class="ib" data-act="todoDel" data-arg="${x.id}">✕</button></div>`).join('') || empty('Your personal list — only you can see it.')}</div>`)}`;
};

/* Attendance */
let attState = { month: today().slice(0, 7), uid: null, tab: 'log' };
PAGES.attendance = () => {
  const uid = (isStaff() && attState.uid) || me.id, m = attState.month, t = today();
  const rows = DB.attendance.filter(a => a.user_id === uid && a.date.startsWith(m)).sort((a, b) => a.date < b.date ? 1 : -1);
  const [y, mo] = m.split('-').map(Number); const end = m === t.slice(0, 7) ? new Date(t + 'T00:00') : new Date(y, mo, 0);
  let expected = 0; for (let d = new Date(y, mo - 1, 1); d <= end; d.setDate(d.getDate() + 1)) { const ds = dstr(d); if (!isOff(ds) && !holiday(ds)) expected++; }
  const done = rows.filter(a => a.out), avg = done.length ? done.reduce((s, a) => s + worked(a), 0) / done.length : 0, late = rows.filter(isLate).length;
  const modes = { office: 0, wfh: 0, field: 0 }; rows.forEach(a => modes[a.mode]++);
  const days = []; for (let d = new Date(y, mo - 1, 1); d.getMonth() === mo - 1; d.setDate(d.getDate() + 1)) { const ds = dstr(d); const a = rows.find(x => x.date === ds); const h = holiday(ds), l = leaveOn(uid, ds); days.push({ ds, a, h, l, status: a ? (isLate(a) ? 'late' : 'present') : h ? 'holiday' : l ? 'leave' : isOff(ds) ? 'off' : ds < t ? 'absent' : 'future' }); }
  const team = DB.users.filter(u => u.active); const byDept = {}; team.forEach(u => (byDept[u.role !== 'member' ? 'Admin & Operations' : u.department || 'Other'] ||= []).push(u));
  return title('Attendance', 'Clock in from your dashboard. Your work mode is detected from your location.', `${isStaff() ? `<select data-act="attUser" style="width:180px">${opts(team.map(u => [u.id, u.id === me.id ? 'Me' : u.name]), uid)}</select>` : ''}<div class="row"><button class="ib" data-act="attMonth" data-arg="-1">‹</button><b>${new Date(m + '-01T00:00').toLocaleDateString([], { month: 'long', year: 'numeric' })}</b><button class="ib" data-act="attMonth" data-arg="1">›</button></div>`)
    + `<div class="grid c4 stats">${stat('📅', `${rows.length} / ${expected}`, 'Days present / working days', expected - rows.length > 0 ? 'bad' : 'ok')}${stat('⏱', fmtDur(avg), 'Average day (net of breaks)', 'info')}${stat('🏢', `${modes.office} · ${modes.wfh} · ${modes.field}`, 'Office · Home · Field')}${stat('⏰', late, 'Late clock-ins', late ? 'bad' : '')}</div>`
    + tabsHtml([['log', 'Log'], ['cal', 'Calendar'], ['team', 'Team today', DB.attendance.filter(a => a.date === t).length]], attState.tab, 'attTab')
    + (attState.tab === 'log' ? card('', rows.length ? `<div class="tw"><table><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Breaks</th><th>Mode</th><th>Note</th>${isStaff() ? '<th></th>' : ''}</tr>${rows.map(a => `<tr><td>${fmtDate(a.date)}${isLate(a) ? ' ' + pill('Late', 'bad') : ''}</td><td>${fmtTime(a.in)}</td><td>${fmtTime(a.out)}</td><td class="tab">${a.out ? fmtDur(worked(a)) : '—'}</td><td class="muted">${breakMins(a) ? Math.round(breakMins(a)) + 'm' : '—'}</td><td>${pill(MODES[a.mode], MTONE[a.mode])}</td><td class="muted small">${esc(a.note)}${a.dist && a.mode !== 'office' ? ` · ${Math.round(a.dist / 100) / 10} km away` : ''}</td>${isStaff() ? `<td class="right"><button class="btn xs" data-act="attEdit" data-arg="${a.id}">Edit</button></td>` : ''}</tr>`).join('')}</table></div>` : empty('No attendance recorded this month.'))
      : attState.tab === 'cal' ? card('', calendar(days) + `<div class="row wrap small muted mt"><span>🟩 Present</span><span>🟧 Late</span><span>🟦 Leave</span><span>🟨 Holiday</span><span>⬜ Weekly off</span><span>🟥 Absent</span></div>`)
      : Object.entries(byDept).map(([d, list]) => card(d, list.map(u => { const a = attOf(u.id); const l = leaveOn(u.id, t); return `<div class="lr">${av(u, 'sm')}<span class="grow">${u.id === me.id ? 'You' : esc(u.name)}<div class="small muted">${esc(u.title || '')}</div></span>${l ? pill('On leave', 'info') : a ? `<span class="muted small hm">${fmtTime(a.in)}${a.out ? ' – ' + fmtTime(a.out) : ''}</span>${onBreak(a) ? pill('Break', 'warn') : ''}${isLate(a) && isStaff() ? pill('Late', 'bad') : ''}${pill(a.out ? 'Done' : MODES[a.mode], MTONE[a.mode])}` : pill('Not in yet')}</div>`; }).join(''), { action: `<span class="small muted">${list.filter(u => attOf(u.id)).length} of ${list.length} in</span>` })).join(''));
};
function calendar(days, extra = () => '') { const padN = (new Date(days[0].ds + 'T00:00').getDay() + 6) % 7; return `<div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="ch">${d}</div>`).join('')}${'<div class="cd pad"></div>'.repeat(padN)}${days.map(d => `<div class="cd ${d.status} ${d.ds === today() ? 'today' : ''}" title="${esc(d.h || (d.l ? LEAVE[d.l.type] + ' leave' : '') || (d.a ? fmtTime(d.a.in) + ' – ' + fmtTime(d.a.out) : ''))}"><b>${+d.ds.slice(8)}</b>${d.a ? `<span class="tab">${d.a.out ? fmtDur(worked(d.a)).replace(/ 0+m$/, '') : fmtTime(d.a.in)}</span>` : ''}${d.h ? `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.h)}</span>` : ''}${d.l && !d.a ? `<span>${d.l.half ? 'Half day' : 'Leave'}</span>` : ''}${extra(d)}</div>`).join('')}</div>`; }

/* Work report */
let wlDate = today();
PAGES.worklog = () => {
  const logs = DB.worklogs.filter(w => w.user_id === me.id && w.date === wlDate), hist = DB.worklogs.filter(w => w.user_id === me.id && w.date.startsWith(today().slice(0, 7))).sort((a, b) => a.date < b.date ? 1 : -1);
  const byDay = {}; hist.forEach(w => (byDay[w.date] ||= []).push(w));
  return title('Work report', 'End your day by noting what you worked on. Admin & operations read these every day.') + `<div class="grid" style="grid-template-columns:3fr 2fr">${card(`<span class="row"><button class="ib" data-act="wlDate" data-arg="-1">‹</button>${fmtLong(wlDate)}<button class="ib" data-act="wlDate" data-arg="1" ${wlDate >= today() ? 'disabled' : ''}>›</button></span>`,
    (logs.map(w => `<div class="wl"><div class="row"><b>${w.hours ? w.hours + 'h' : ''}</b>${w.department ? dpill(w.department) : ''}<span class="grow"></span><button class="ib" data-act="wlDel" data-arg="${w.id}">✕</button></div><p>${esc(w.summary)}</p>${w.blockers ? `<div class="err small">Blocked: ${esc(w.blockers)}</div>` : ''}</div>`).join('') || empty('Nothing reported for this day yet.'))
    + `<form data-form="worklog" class="mt" style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px"><b class="small">Add an entry</b>${F('What did you work on?', '<textarea name="summary" required rows="3" placeholder="e.g. Finished the MyGov carousel set (8 slides), reviewed the tourism film cut with Ops"></textarea>')}<div class="fg">${F('Hours spent', '<input name="hours" type="number" step="0.5" min="0" max="16" placeholder="e.g. 3.5">')}${F('Anything blocking you?', '<input name="blockers" placeholder="e.g. Waiting for client feedback on the logo">', 'Blockers alert admin & operations immediately.')}</div><div class="right"><button class="btn p">Save report</button></div></form>`, { action: logs.length ? pill(logs.reduce((s, w) => s + (+w.hours || 0), 0) + 'h logged') : '' })}
  ${card('History this month', Object.entries(byDay).map(([d, ws]) => `<button class="lr" style="width:100%;text-align:left;${d === wlDate ? 'background:var(--ysoft)' : ''}" data-act="wlGo" data-arg="${d}"><b style="min-width:58px">${fmtDate(d)}</b><span class="grow small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ws.map(w => w.summary).join(' · '))}</span><span class="small muted">${ws.reduce((s, w) => s + (+w.hours || 0), 0) || ''}${ws.some(w => w.blockers) ? ' ⚠' : ''}</span></button>`).join('') || empty('No reports this month.'))}</div>`;
};

/* Leaves */
let leaveTab = 'mine';
const leaveDays = l => l.half ? 0.5 : Math.round((new Date(l.to) - new Date(l.from)) / 864e5) + 1;
PAGES.leaves = () => {
  const yr = today().slice(0, 4), q = DB.settings.quota;
  const used = k => DB.leaves.filter(l => l.user_id === me.id && l.status === 'approved' && l.type === k && l.from.startsWith(yr)).reduce((s, l) => s + leaveDays(l), 0);
  const rows = (leaveTab === 'team' ? DB.leaves : DB.leaves.filter(l => l.user_id === me.id)).slice().sort((a, b) => (b.status === 'pending') - (a.status === 'pending') || (a.at < b.at ? 1 : -1));
  return title('Leaves', 'Request time off and track your balance. Half days are supported.', '<button class="btn p" data-act="leaveForm">Request leave</button>')
    + `<div class="grid c4 stats">${Object.entries(q).map(([k, n]) => stat({ casual: '☀️', sick: '🤒', earned: '✈️' }[k], `${n - used(k)} / ${n}`, LEAVE[k] + ' leave left', n - used(k) <= 0 ? 'bad' : '')).join('')}${stat('⏳', used('unpaid'), 'Unpaid days this year')}</div>`
    + (isStaff() ? tabsHtml([['mine', 'My requests'], ['team', 'Team requests', DB.leaves.filter(l => l.status === 'pending').length]], leaveTab, 'leaveTab') : '')
    + card('', rows.length ? `<div class="tw"><table><tr>${leaveTab === 'team' ? '<th>Member</th>' : ''}<th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr>${rows.map(l => `<tr>${leaveTab === 'team' ? `<td><span class="row">${av(user(l.user_id), 'sm')}<span>${esc(uname(l.user_id))}<div class="small muted">${user(l.user_id)?.department || ''}</div></span></span></td>` : ''}<td>${LEAVE[l.type]}${l.half ? `<div class="small muted">${l.half} half</div>` : ''}</td><td>${fmtDate(l.from)}${l.to !== l.from ? ' – ' + fmtDate(l.to) : ''}</td><td class="tab">${leaveDays(l)}</td><td class="muted small">${esc(l.reason)}${l.note ? `<div>↳ ${esc(l.note)} — ${uname(l.by)}</div>` : ''}</td><td>${spill(l.status)}</td><td class="right">${l.status === 'pending' ? (leaveTab === 'team' ? `<button class="btn xs p" data-act="decide" data-arg="leaves:${l.id}">Review</button>` : `<button class="btn xs" data-act="withdraw" data-arg="leaves:${l.id}">Withdraw</button>`) : ''}</td></tr>`).join('')}</table></div>` : empty('No leave requests yet.'));
};
/* Regularization */
let regTab = 'mine';
PAGES.regularization = () => {
  const rows = (regTab === 'team' ? DB.regs : DB.regs.filter(r => r.user_id === me.id)).slice().sort((a, b) => (b.status === 'pending') - (a.status === 'pending') || (a.at < b.at ? 1 : -1));
  return title('Regularization', 'Forgot to clock in, or the location got it wrong? Ask for the record to be corrected.', '<button class="btn p" data-act="regForm">New request</button>')
    + (isStaff() ? tabsHtml([['mine', 'My requests'], ['team', 'Team requests', DB.regs.filter(r => r.status === 'pending').length]], regTab, 'regTab') : '')

  approve(arg) { ACT.doDecide(arg + ':approved'); }, reject(arg) { ACT.decide(arg); },
  doDecide(arg) { const [k, id, status] = arg.split(':'); const x = DB[k].find(r => r.id === +id); if (!x) return; x.status = status; x.by = me.id; x.note = document.getElementById('dnote')?.value || ''; x.decided_at = nowIso();
    if (k === 'regs' && status === 'approved') { let a = attOf(x.user_id, x.date); const ci = x.rin ? new Date(`${x.date}T${x.rin}:00`).toISOString() : null, co = x.rout ? new Date(`${x.date}T${x.rout}:00`).toISOString() : null; if (a) { if (ci) a.in = ci; if (co) a.out = co; if (x.mode) a.mode = x.mode; a.note = 'Regularized: ' + x.reason; } else if (ci) DB.attendance.push({ id: nid(), user_id: x.user_id, date: x.date, in: ci, out: co, mode: x.mode || 'office', note: 'Regularized: ' + x.reason, breaks: [] }); }
    notify(x.user_id, 'notification', `${{ leaves: 'Leave', regs: 'Regularization', expenses: 'Expense' }[k]} ${status}`, `By ${me.name}. ${x.note}`.trim(), `#/${{ leaves: 'leaves', regs: 'regularization', expenses: 'expenses' }[k]}`); save(); closeModal(); toast(`${status === 'approved' ? 'Approved' : 'Rejected'} — ${uname(x.user_id)} has been notified`); render(); },
  expPaid(id) { const x = DB.expenses.find(e => e.id === +id); x.status = 'paid'; x.paid_at = nowIso(); notify(x.user_id, 'notification', 'Expense paid', money(x.amount) + ' for ' + x.category, '#/expenses'); save(); toast('Marked as paid'); render(); },
  assignWork(dept) { assignWorkForm(dept); }, assignWorkTo(uid) { const u = user(+uid); assignWorkForm(u.department); setTimeout(() => { const cb = document.querySelector(`[name="a:${uid}"]`); if (cb) cb.checked = true; }, 0); },
  openTask(id) { openTask(+id); },
  taskAssign(arg) { const [tid, uid] = arg.split(':').map(Number); const x = DB.tasks.find(t => t.id === tid); if (x.assignees.includes(uid)) x.assignees = x.assignees.filter(i => i !== uid); else { if (!assignable().some(u => u.id === uid)) return toast('You can only assign work within your department.', 'bad'); x.assignees.push(uid); if (uid !== me.id) notify(uid, 'notification', `${me.name} assigned you work`, x.title, `#/boards/${x.department}?task=${x.id}`); } save(); openTask(tid); render(); },
  taskDel(id) { if (confirm('Delete this task?')) { DB.tasks = DB.tasks.filter(t => t.id !== +id); save(); closeModal(); render(); } },
  ack(id) { DB.acks.push({ a: +id, u: me.id, at: nowIso() }); save(); toast('Acknowledged'); render(); },
  annForm() { openModal('New announcement', `<form data-form="announcement" style="display:flex;flex-direction:column;gap:12px">${F('Title', '<input name="title" required placeholder="e.g. Office closed on Monday">')}${F('Message', '<textarea name="body" rows="5"></textarea>')}<div class="row wrap"><label class="row small"><input type="checkbox" name="pinned"> Pin to top</label><label class="row small"><input type="checkbox" name="needs_ack"> Everyone must acknowledge</label></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn p">Post</button></div></form>`); },
  annDel(id) { if (confirm('Delete this announcement?')) { DB.announcements = DB.announcements.filter(a => a.id !== +id); save(); render(); } },
  alertForm() { openModal('Send an alert', `<form data-form="alert" style="display:flex;flex-direction:column;gap:12px">${F('Title', '<input name="title" required placeholder="e.g. Client shoot moved to 8 AM tomorrow">')}${F('Message', '<textarea name="body"></textarea>')}${F('Send to', `<select name="to">${opts([['all', 'Everyone'], ...DEPTS.map(d => [d, d])])}</select>`)}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn p">Send</button></div></form>`); },
  readAll(kind) { DB.notifications.forEach(n => { if (n.user_id === me.id && n.kind === kind) n.read = 1; }); save(); render(); },
  openNotif(id) { const n = DB.notifications.find(x => x.id === +id); n.read = 1; save(); if (n.link) location.hash = n.link; else render(); },
  todoToggle(id) { const x = DB.todos.find(t => t.id === +id); x.done = !x.done; save(); render(); }, todoDel(id) { DB.todos = DB.todos.filter(t => t.id !== +id); save(); render(); },
  person(id) { const u = user(+id); const a = attOf(u.id); openModal(esc(u.name), `<div class="row" style="gap:14px;align-items:flex-start">${av(u, 'lg')}<div><div class="row wrap">${rpill(u.role)}${dpill(u.department)}</div><div class="mt">${esc(u.title || '')}</div></div></div><div class="mt" style="display:flex;flex-direction:column;gap:8px"><a href="mailto:${esc(u.email)}">✉ ${esc(u.email)}</a>${u.phone ? `<a href="tel:${esc(u.phone)}">☎ ${esc(u.phone)}</a>` : ''}${u.joined ? `<div class="small muted">Joined ${fmtDate(u.joined)}</div>` : ''}${a ? `<div class="small muted">Today: ${MODES[a.mode]} · in ${fmtTime(a.in)}</div>` : ''}${isStaff() && u.emergency ? `<div class="small muted">🚨 ${esc(u.emergency)}</div>` : ''}</div>${u.id !== me.id && (isStaff() || (u.department && u.department === me.department)) ? `<div class="right mt"><button class="btn p sm" data-act="assignWorkTo" data-arg="${u.id}">＋ Assign work</button></div>` : ''}`); },
  memberForm(id) { const u = id ? user(+id) : { role: 'member', department: DEPTS[0] }; openModal(id ? 'Edit member' : 'Add member', `<form data-form="member" data-arg="${id || ''}" class="fg">${F('Name', `<input name="name" required value="${esc(u.name || '')}">`)}${F('Work email', `<input name="email" type="email" required value="${esc(u.email || '')}">`)}${F('Role', `<select name="role" ${u.id === me.id ? 'disabled' : ''}>${opts(Object.entries(ROLES), u.role)}</select>`, 'Operations sees everything and approves; Admin also manages members & settings.')}${F('Department', `<select name="department">${opts([['', '— none —'], ...DEPTS.map(d => [d, d])], u.department)}</select>`)}${F('Title', `<input name="title" value="${esc(u.title || '')}" placeholder="e.g. Senior Editor">`)}${F('Phone', `<input name="phone" type="tel" value="${esc(u.phone || '')}">`)}${F('Joined', `<input name="joined" type="date" value="${u.joined || today()}">`)}${F('Birthday', `<input name="birthday" type="date" value="${u.birthday || ''}">`)}${F(id ? 'Reset password' : 'Temporary password', `<input name="password" ${id ? '' : 'required'} minlength="6">`, id ? 'Leave blank to keep the current one.' : 'Share this with them; they should change it after first sign-in.', 'full')}<div class="full row" style="justify-content:space-between">${id && u.id !== me.id ? `<button type="button" class="btn danger" data-act="deactivate" data-arg="${id}">Deactivate</button>` : '<span></span>'}<span class="row"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn p">Save</button></span></div></form>`); },
  deactivate(id) { if (confirm('Deactivate this member? They will no longer be able to sign in.')) { user(+id).active = false; save(); closeModal(); render(); } }, reactivate(id) { user(+id).active = true; save(); render(); },
  holDel(id) { DB.holidays = DB.holidays.filter(h => h.id !== +id); save(); render(); },
  useHere() { locate().then(l => { document.querySelector('[name=office_lat]').value = l.lat.toFixed(6); document.querySelector('[name=office_lng]').value = l.lng.toFixed(6); toast(`Office set to your current position (±${Math.round(l.acc)} m). Save to apply.`); }).catch(e => toast(e.message, 'bad')); },
  saveHome() { locate().then(l => { me.home_lat = l.lat; me.home_lng = l.lng; save(); toast('Home location saved. Clock-ins from here will count as Work from home.'); render(); }).catch(e => toast(e.message, 'bad')); },
  reset() { if (confirm('Clear this browser\'s local copy and sign out? Nothing on the server is deleted.')) { localStorage.removeItem(KEY); localStorage.removeItem(SKEY); location.reload(); } },
};
/* ---------- forms ---------- */
const FORMS = {
  todo(f) { if (f.text.trim()) DB.todos.push({ id: nid(), user_id: me.id, text: f.text.trim(), done: false }); },
  worklog(f) { if (!f.summary.trim()) return; DB.worklogs.push({ id: nid(), user_id: me.id, date: wlDate, hours: +f.hours || 0, summary: f.summary.trim(), blockers: f.blockers.trim(), department: me.department, at: nowIso() }); if (f.blockers.trim()) approvers(me.id).forEach(id => notify(id, 'alert', `${me.name} reported a blocker`, f.blockers, '#/reports')); toast('Report saved. Nice work today!'); },
  leave(f) { const to = f.half ? f.from : (f.to || f.from); if (to < f.from) return toast('Choose a valid date range.', 'bad'); if (DB.leaves.some(l => l.user_id === me.id && l.status !== 'rejected' && l.from <= to && l.to >= f.from)) return toast('You already have a leave request covering those dates.', 'bad'); DB.leaves.push({ id: nid(), user_id: me.id, type: f.type, from: f.from, to, half: f.half, reason: f.reason, status: 'pending', at: nowIso() }); approvers(me.id).forEach(id => notify(id, 'notification', `${me.name} requested ${LEAVE[f.type]} leave`, `${f.from}${to !== f.from ? ' to ' + to : ''}. ${f.reason}`, '#/approvals')); closeModal(); toast('Leave request send for approval'); },
  reg(f) { if (!f.reason.trim()) return; DB.regs.push({ id: nid(), user_id: me.id, date: f.date, rin: f.rin, rout: f.rout, mode: f.mode, reason: f.reason, status: 'pending', at: nowIso() }); approvers(me.id).forEach(id => notify(id, 'notification', `${me.name} asked to regularize ${f.date}`, f.reason, '#/approvals')); closeModal(); toast('Request send for approval'); },
  expense(f, form) { const file = form.querySelector('[name=receipt]').files[0]; const done = receipt => { DB.expenses.push({ id: nid(), user_id: me.id, date: f.date, category: f.category, amount: +f.amount, desc: f.desc, receipt, status: 'pending', at: nowIso() }); approvers(me.id).forEach(id => notify(id, 'notification', `${me.name} claimed ${money(f.amount)}`, `${f.category} · ${f.desc}`, '#/approvals')); save(); closeModal(); toast('Claim submitted for approval'); render(); }; if (file && file.size < 1500000) { const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(file); return 'async'; } if (file) toast('Receipt too large to keep in the browser (1.5 MB max) — claim saved without it.', 'bad'); done(null); return 'async'; },
  assign(f) { const to = Object.keys(f).filter(k => k.startsWith('a:') && f[k]).map(k => +k.slice(2)); if (!to.length) return toast('Choose who should do it.', 'bad'); const ok = new Set(assignable().map(u => u.id)); if (to.some(id => !ok.has(id))) return toast('You can only assign work within your department.', 'bad'); const dept = f.department || me.department || user(to[0]).department; const t = { id: nid(), title: f.title.trim(), desc: f.desc, department: dept, created_by: me.id, assignees: to, due: f.due || null, priority: f.priority, status: 'To do', at: nowIso() }; DB.tasks.push(t); to.forEach(id => { if (id !== me.id) notify(id, 'notification', `${me.name} assigned you work`, t.title + (t.due ? ' · due ' + t.due : ''), `#/boards/${dept}?task=${t.id}`); }); closeModal(); toast(`Assigned "${t.title}" to ${to.map(id => uname(id).split(' ')[0]).join(', ')}`); },
  comment(f, form) { const tid = +form.dataset.arg; if (!f.body.trim()) return; DB.comments.push({ id: nid(), task_id: tid, user_id: me.id, body: f.body.trim(), at: nowIso() }); const x = DB.tasks.find(t => t.id === tid); [...x.assignees, x.created_by].filter(id => id !== me.id).forEach(id => notify(id, 'notification', `${me.name} commented on "${x.title}"`, f.body.slice(0, 120), `#/boards/${x.department}?task=${tid}`)); save(); openTask(tid); return 'async'; },
  announcement(f) { const a = { id: nid(), title: f.title.trim(), body: f.body, pinned: f.pinned ? 1 : 0, needs_ack: f.needs_ack ? 1 : 0, by: me.id, at: nowIso() }; DB.announcements.push(a); DB.users.filter(u => u.active && u.id !== me.id).forEach(u => notify(u.id, 'notification', 'Announcement: ' + a.title, a.body.slice(0, 140), '#/announcements')); closeModal(); toast('Announcement posted'); },
  alert(f) { const targets = DB.users.filter(u => u.active && (f.to === 'all' || u.department === f.to)); targets.forEach(u => notify(u.id, 'alert', f.title, f.body, '#/alerts')); closeModal(); toast(`Alert sent to ${targets.length} member${targets.length === 1 ? '' : 's'}`); },
  attEdit(f, form) { const a = DB.attendance.find(x => x.id === +form.dataset.arg); if (f.in) a.in = new Date(`${a.date}T${f.in}:00`).toISOString(); if (f.out) a.out = new Date(`${a.date}T${f.out}:00`).toISOString(); a.mode = f.mode; a.note = f.note; closeModal(); toast('Attendance updated'); },
  member(f, form) { const id = +form.dataset.arg; const email = f.email.trim().toLowerCase(); if (DB.users.some(u => u.email === email && u.id !== id)) return toast('A member with that email already exists.', 'bad');
    (async () => { const pw = f.password ? await sha(f.password) : null;
      if (id) { const u = user(id); Object.assign(u, { name: f.name.trim(), email, title: f.title, department: f.department, phone: f.phone, joined: f.joined, birthday: f.birthday }); if (u.id !== me.id) u.role = f.role; if (pw) { u.password = pw; notify(u.id, 'alert', 'Your password was reset', 'An admin reset your password.', '#/profile'); } }
      else { const u = { id: nid(), name: f.name.trim(), email, password: pw, role: f.role, title: f.title, department: f.department, phone: f.phone, joined: f.joined, birthday: f.birthday, active: true }; DB.users.push(u); notify(u.id, 'notification', 'Welcome to ' + DB.settings.company, 'Your account is ready. Clock in from your dashboard every day.', '#/'); }
      closeModal(); toast('Member saved'); save(); render(); })(); return 'async'; },
  settings(f) { const s = DB.settings; Object.assign(s, { company: f.company, office_name: f.office_name, office_lat: +f.office_lat, office_lng: +f.office_lng, office_radius: +f.office_radius, home_radius: +f.home_radius, work_start: f.work_start, work_end: f.work_end, grace: +f.grace, weekly_off: f.weekly_off, currency: f.currency, exp_cats: f.exp_cats.split(',').map(x => x.trim()).filter(Boolean), quota: { casual: +f.q_casual, sick: +f.q_sick, earned: +f.q_earned } }); toast('Settings saved'); },
  holiday(f) { DB.holidays.push({ id: nid(), name: f.name, date: f.date }); toast('Holiday added'); },
  profile(f) { Object.assign(me, { phone: f.phone, birthday: f.birthday, emergency: f.emergency, blood: f.blood, address: f.address }); toast('Profile saved'); },
  password(f) { (async () => { if (!(await checkPw(me, f.cur))) return toast('Current password is incorrect.', 'bad'); me.password = await sha(f.next); save(); render(); toast('Password changed'); })(); return 'async'; },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return; if (el.type === 'checkbox') return; const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.arg); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (fn && (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'date')) fn(el.type === 'checkbox' ? el.dataset.arg : el.value); });
document.addEventListener('submit', e => { const form = e.target.closest('[data-form]'); if (!form) return; e.preventDefault(); const r = FORMS[form.dataset.form]?.(formData(form), form); if (r !== 'async') { save(); render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
setInterval(() => { if (me && !document.getElementById('modal')) render(); }, 60000);   // keep the live timer fresh
boot();
</script>
</body>
</html>
